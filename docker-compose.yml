services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: amjad
      POSTGRES_PASSWORD: amjad
      POSTGRES_DB: amjadscorner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amjad -d amjadscorner"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
